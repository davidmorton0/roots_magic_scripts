# Settings for scripts/check.py and other scripts.
# Copy to config.toml (git-ignored) and edit; scripts use config.toml if it
# exists, otherwise this file.

# Folder holding the scans, as Windows sees it.
scan_root = 'H:\My Drive\Records'

# Folder where new record files are placed before they are added to the tree
# (rm-add-record skill moves them from here to their record type's folder).
input_folder = 'H:\My Drive\Records\Input'

# Test tree, as Windows sees it, and the working copy in the project
# (scripts/general/working_copy.py).
test_tree = 'H:\My Drive\RootsMagic Work\Morton Tree - FreeBMD template test.rmtree'
working_copy = "tmp/work/Morton Tree.rmtree"

# Top-level folders under scan_root that do not hold source scans.
not_scan_folders = [
    "Unsorted",
    "Input",
    "Research Logs",
    "Family Data Sheet",
    "Info",
    "Maps",
    "House",
    "Family Trees",
    "Photos",
]

# Subfolders anywhere under scan_root whose files are left unattached on purpose.
skip_subfolders = ["unsure"]

# File types counted as scans.
scan_extensions = [".jpg", ".jpeg", ".pdf", ".tif", ".tiff", ".png", ".gif", ".webp"]

# Fact types normally dated after the person's death.
after_death_facts = [
    "Burial",
    "Grave",
    "Will",
    "Will - Administration",
    "Newspaper Article",
    "Death Register",
    "Death Certificate - UK",
    "Death Certificate - US",
]

# Age limits (years) for parent and marriage checks.
min_parent_age = 13
max_mother_age = 50
min_marriage_age = 14
